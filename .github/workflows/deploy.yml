name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare static site
        run: |
          rm -rf dist
          mkdir dist
          cp index.html tournaments.html rankings.html news.html referees.html about.html privacy.html login.html dist/

      - name: Ensure Cloudflare Pages project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          status=$(curl -sS -o /tmp/pages-project.json -w '%{http_code}' \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/af27f3bbca2209ff9cb2c77a2e47184a/pages/projects/chess-homepage")
          if [ "$status" = "404" ]; then
            curl --fail-with-body -sS \
              -X POST \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              --data '{"name":"chess-homepage","production_branch":"main"}' \
              "https://api.cloudflare.com/client/v4/accounts/af27f3bbca2209ff9cb2c77a2e47184a/pages/projects"
          elif [ "$status" != "200" ]; then
            cat /tmp/pages-project.json
            exit 1
          fi

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: af27f3bbca2209ff9cb2c77a2e47184a
          command: pages deploy dist --project-name=chess-homepage --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
