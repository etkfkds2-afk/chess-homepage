<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>랭킹 · 대한체스연맹</title>
<style>
:root{--bg:#f7f8fa;--card:#fff;--text:#1f2937;--muted:#6b7280;--line:#e5e7eb;--brand:#111827;--accent:#2563eb}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:ui-sans-serif,system-ui,-apple-system,"Noto Sans KR",sans-serif}
header{background:var(--brand);color:#fff}
.nav{width:min(1080px,calc(100% - 32px));margin:0 auto;display:flex;align-items:center;justify-content:space-between;height:64px}
.logo{font-weight:900;font-size:18px;color:#fff;text-decoration:none;display:flex;align-items:center;gap:8px}
.logo span{color:var(--accent)}
.menu{display:flex;gap:26px;list-style:none;margin:0;padding:0}
.menu a{color:#d1d5db;text-decoration:none;font-size:14px;font-weight:600}
.menu a:hover,.menu a.active{color:#fff}
main{width:min(1080px,calc(100% - 32px));margin:0 auto;padding:40px 0 64px}
h1{font-size:24px;margin:0 0 18px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.tab{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:7px 14px;font-size:13px;font-weight:700;color:var(--muted);cursor:pointer}
.tab.active{background:var(--brand);color:#fff;border-color:var(--brand)}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
th,td{padding:12px 14px;text-align:left;font-size:14px;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:700;font-size:12px;background:#f8fafc}
.empty{color:var(--muted);font-size:14px;padding:40px 0;text-align:center}
footer{border-top:1px solid var(--line);padding:24px 0;text-align:center}
.footlinks{display:flex;gap:16px;justify-content:center;margin-bottom:8px}
.footlinks a{color:var(--muted);font-size:12px;text-decoration:none}
.copy{color:#9ca3af;font-size:12px}
@media(max-width:720px){.menu{display:none}}
</style>
</head>
<body>
<header>
<div class="nav">
<a class="logo" href="/">♞ 대한<span>체스</span>연맹</a>
<ul class="menu">
<li><a href="/tournaments.html">대회 일정</a></li>
<li><a class="active" href="/rankings.html">랭킹</a></li>
<li><a href="/news.html">뉴스</a></li>
<li><a href="/referees.html">심판·지도사</a></li>
<li><a href="/about.html">소개</a></li>
</ul>
</div>
</header>
<main>
<h1>랭킹</h1>
<div class="tabs">
<div class="tab active">Standard</div>
<div class="tab">Rapid</div>
<div class="tab">Blitz</div>
<div class="tab">U18</div>
<div class="tab">U14</div>
<div class="tab">U10</div>
<div class="tab">여성</div>
<div class="tab">마스터</div>
</div>
<table>
<thead><tr><th>순위</th><th>이름</th><th>레이팅</th><th>지역</th></tr></thead>
<tbody id="rankingBody">
<tr><td colspan="4" class="empty">랭킹 데이터가 아직 없습니다.</td></tr>
</tbody>
</table>
</main>
<footer>

</div>
<div class="copy">© 대한체스연맹</div>
</footer>
</body>
</html>
