<style>
:root{--navy:#0f1626;--red:#d0163a;--gold:#cda434;--bg:#f4f5f7;--text:#1f2430;--muted:#6b7280;--line:#e2e5ea}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Malgun Gothic',"Noto Sans KR",sans-serif;line-height:1.6}
.topbar{background:#fff;position:sticky;top:0;z-index:40;border-bottom:3px solid var(--red);box-shadow:0 1px 0 #eceef2}
.topbar-in{max-width:1100px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;justify-content:space-between}
.kcf-logo{font-weight:900;font-size:19px;color:var(--navy);text-decoration:none;display:flex;align-items:center;gap:8px}
.kcf-logo span{color:var(--red)}
.topnav{display:flex;align-items:center}
.topnav a{color:#3a4256;text-decoration:none;margin-left:22px;font-size:.92rem;font-weight:700}
.topnav a:hover{color:var(--red)}
@media(max-width:780px){.topnav{display:none}}
main{max-width:1100px;margin:0 auto;padding:56px 24px 90px}
.eyebrow{display:block;font-size:.72rem;font-weight:800;letter-spacing:3px;color:var(--gold);margin-bottom:6px}
h1{font-size:1.7rem;font-weight:900;letter-spacing:-.5px;margin-bottom:36px}
h1::after{content:"";display:block;width:46px;height:3px;background:var(--gold);margin-top:10px}
table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-top:3px solid var(--navy)}
th,td{padding:12px 16px;text-align:left;font-size:.9rem;border-bottom:1px solid #eef0f4}
th{color:#8a8f9c;font-weight:800;font-size:.72rem;letter-spacing:1.5px;text-transform:uppercase;border-bottom:2px solid var(--navy)}
.empty{color:var(--muted);font-size:.9rem;padding:40px 0;text-align:center}
footer{text-align:center;color:var(--muted);font-size:.84rem;padding:34px 24px 50px}
footer a{color:var(--muted);text-decoration:none}
</style>
</head>
