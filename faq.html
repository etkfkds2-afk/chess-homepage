<style>
:root{--ink:#07111f;--line:rgba(255,255,255,.12);--red:#d9153f;--blue:#2f7bff;--text:#e9edf5;--muted:#aeb8c8}
*{box-sizing:border-box}
body{margin:0;background:var(--ink);color:var(--text);font-family:"Noto Sans KR",-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;line-height:1.6}
.topbar{background:#fff;position:sticky;top:0;z-index:40;border-bottom:3px solid var(--red)}
.topbar-in{max-width:1120px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;justify-content:space-between}
.kcf-logo{font-weight:900;font-size:19px;color:#142032;text-decoration:none;display:flex;align-items:center;gap:8px}
.kcf-logo span{color:var(--red)}
.topnav{display:flex;align-items:center;gap:24px}
.topnav a{color:#3a4256;text-decoration:none;font-size:.92rem;font-weight:700}
.topnav a:hover{color:var(--blue)}
.button{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:999px;padding:11px 20px;background:var(--blue);color:#fff;font:700 15px "Noto Sans KR",sans-serif;text-decoration:none;cursor:pointer;transition:transform .2s,opacity .2s}
.button:hover{transform:translateY(-2px);opacity:.92}
@media(max-width:780px){.topnav{display:none}}
main{max-width:820px;margin:0 auto;padding:56px 24px 90px}
.eyebrow{display:block;font-size:.72rem;font-weight:800;letter-spacing:3px;color:#77a5ff;margin-bottom:6px}
h1{font-size:1.7rem;font-weight:900;letter-spacing:-.5px;margin-bottom:36px}
h1::after{content:"";display:block;width:46px;height:3px;background:var(--red);margin-top:10px}
.empty{background:rgba(255,255,255,.055);border:1px solid var(--line);border-radius:16px;padding:40px 28px;text-align:center;color:var(--muted);font-size:.94rem}
footer{text-align:center;color:var(--muted);font-size:.84rem;padding:34px 24px 50px}
footer a{color:var(--muted);text-decoration:none}
</style>
</head>
<body>
<div class="topbar">
  <div class="topbar-in">
    <a class="kcf-logo" href="/">♞ 대한<span>체스</span>연맹</a>
