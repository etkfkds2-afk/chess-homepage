<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>관리자 로그인 · 대한체스연맹</title>
<style>
:root{--navy:#0f1626;--red:#d0163a;--gold:#cda434;--bg:#f4f5f7;--text:#1f2430;--muted:#6b7280}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Malgun Gothic',"Noto Sans KR",sans-serif}
main{text-align:center;background:#fff;border:1px solid #e2e5ea;border-top:3px solid var(--navy);padding:40px 48px}
h1{font-size:1.2rem;font-weight:900;margin:0 0 8px}
p{color:var(--muted);font-size:.9rem;margin:0 0 16px}
a{color:var(--navy);font-size:.88rem;font-weight:700;text-decoration:none}
</style>
</head>
<body>
<main>
<h1>관리자 로그인</h1>
<p>준비 중입니다.</p>
<a href="/">← 홈으로</a>
</main>
</body>
</html>
