<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>관리자 로그인 · 대한체스연맹</title>
<style>
:root{--ink:#07111f;--line:rgba(255,255,255,.12);--red:#d9153f;--blue:#2f7bff;--text:#e9edf5;--muted:#aeb8c8}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--ink);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Malgun Gothic',"Noto Sans KR",sans-serif}
main{text-align:center;background:rgba(255,255,255,.055);border:1px solid var(--line);border-radius:16px;padding:40px 48px}
h1{font-size:1.2rem;font-weight:900;margin:0 0 8px}
p{color:var(--muted);font-size:.9rem;margin:0 0 16px}
a{color:#82aeff;font-size:.88rem;font-weight:700;text-decoration:none}
</style>
</head>
<body>
<main>
<h1>관리자 로그인</h1>
<p>준비 중입니다.</p>
<a href="/">← 홈으로</a>
</main>
</body>
</html>
